<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Movie Recommender</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
 *{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0a0a0a;--surface:#111;--surface2:#191919;--border:#2a2a2a;--text:#f0ede8;--muted:#888;--accent:#a8d8ea;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:3rem 1.5rem;}
.wrap{max-width:900px;margin:0 auto;}
h1{font-family:'Syne',sans-serif;font-size:clamp(2rem,5vw,3.5rem);font-weight:800;margin-bottom:0.5rem;}
h1 span{color:var(--accent);text-shadow:0 0 20px rgba(168,216,234,0.5);}
.subtitle{color:var(--muted);margin-bottom:2.5rem;}
.search-box{display:flex;gap:0.75rem;margin-bottom:1rem;flex-wrap:wrap;}
input[type=text]{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.85rem 1.2rem;border-radius:10px;font-size:1rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
input[type=text]:focus{border-color:rgba(168,216,234,0.5);box-shadow:0 0 0 3px rgba(168,216,234,0.07);}
button{background:var(--accent);color:#0a0a0a;border:none;padding:0.85rem 1.8rem;border-radius:10px;font-size:0.95rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.2s;}
button:hover{opacity:0.85;}
.suggestions{background:var(--surface);border:1px solid var(--border);border-radius:10px;max-height:200px;overflow-y:auto;display:none;margin-bottom:1.5rem;}
.suggestion-item{padding:0.65rem 1.2rem;cursor:pointer;font-size:0.9rem;color:var(--muted);transition:background 0.15s;}
.suggestion-item:hover{background:var(--surface2);color:var(--text);}
.matched{color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem;}
.matched span{color:var(--accent);font-weight:500;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.2rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem;transition:border-color 0.2s,transform 0.2s;}
.card:hover{border-color:rgba(168,216,234,0.35);transform:translateY(-3px);}
.card-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:0.4rem;}
.card-genres{color:var(--muted);font-size:0.8rem;margin-bottom:0.75rem;}
.card-bottom{display:flex;justify-content:space-between;align-items:center;}
.rating{background:rgba(168,216,234,0.08);border:1px solid rgba(168,216,234,0.2);color:var(--accent);font-size:0.8rem;padding:0.2rem 0.6rem;border-radius:100px;font-weight:500;}
.match{color:var(--muted);font-size:0.8rem;}
.error{color:#f09595;margin-top:1rem;}
.loading{color:var(--muted);margin-top:1rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Movie <span>Recommender</span></h1>
  <p class="subtitle">Type a movie you love and get 6 recommendations instantly.</p>

  <div class="search-box">
    <input type="text" id="movieInput" placeholder="e.g. Inception, The Dark Knight..." autocomplete="off"/>
    <button onclick="recommend()">Get Recs</button>
  </div>
  <div class="suggestions" id="suggestions"></div>
  <div id="matchedLabel" class="matched"></div>
  <div id="results" class="grid"></div>
</div>

<script>
  const titles = {{ titles|tojson }};
  const input = document.getElementById('movieInput');
  const sugBox = document.getElementById('suggestions');

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    sugBox.innerHTML = '';
    if (!q) { sugBox.style.display='none'; return; }
    const matches = titles.filter(t => t.toLowerCase().includes(q)).slice(0, 8);
    if (!matches.length) { sugBox.style.display='none'; return; }
    matches.forEach(t => {
      const d = document.createElement('div');
      d.className = 'suggestion-item';
      d.textContent = t;
      d.onclick = () => { input.value = t; sugBox.style.display='none'; recommend(); };
      sugBox.appendChild(d);
    });
    sugBox.style.display = 'block';
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.search-box') && !e.target.closest('.suggestions'))
      sugBox.style.display='none';
  });

  input.addEventListener('keydown', e => { if (e.key === 'Enter') recommend(); });

  async function recommend() {
    const movie = input.value.trim();
    if (!movie) return;
    sugBox.style.display = 'none';
    document.getElementById('results').innerHTML = '<p class="loading">Finding recommendations...</p>';
    document.getElementById('matchedLabel').innerHTML = '';
    const res = await fetch('/recommend', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({movie})
    });
    const data = await res.json();
    if (data.error) {
      document.getElementById('results').innerHTML = `<p class="error">${data.error}</p>`;
      return;
    }
    document.getElementById('matchedLabel').innerHTML = `Showing recommendations for <span>${data.matched}</span>`;
    document.getElementById('results').innerHTML = data.recommendations.map(r => `
      <div class="card">
        <div class="card-title">${r.title}</div>
        <div class="card-genres">${r.genres}</div>
        <div class="card-bottom">
          <span class="rating">⭐ ${r.rating}</span>
          <span class="match">${r.score}% match</span>
        </div>
      </div>`).join('');
  }
</script>
</body>
</html>
